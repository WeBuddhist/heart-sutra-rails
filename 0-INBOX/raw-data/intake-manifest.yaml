# Intake manifest — Heart Sūtra (བཅོམ་ལྡན་འདས་མ་ཤེས་རབ་ཀྱི་ཕ་རོལ་ཏུ་ཕྱིན་པའི་སྙིང་པོ།)
#
# Read by 4-SYSTEM/Skills/aligned-corpus-intake/scripts/build_sources.py and verify.py.
# Raw data: Dzongsar Google Docs exported as Markdown (row-aligned pairs) and their
# metadata sheets exported as CSV, renamed sherab-* by the vault owner on 2026-10-03
# (format: 4-SYSTEM/Skills/aligned-corpus-intake/references/md-export-format.md).
#
# Build order = dependency order: the Sanskrit root, then the Tibetan display text
# (its translation), then what aligns to the Tibetan: the Chinese and the nine
# commentaries. A work's `target` must be built above it.
#
# Every value comes from the raw data, or from the 2026-10-02 intake records of the same
# documents (verified letter-identical); human decisions carry reason, who and when.
# Replaces the 2026-10-02 manifest, which read the .docx/OpenPecha downloads since
# removed from raw-data (still in git history).

#
# Added 2026-10-04: three human translations from the public OpenPecha API (verbatim
# download in openpecha-api/, layout per scripts/openpecha_model.py), each a translation of
# OpenPecha text BdfDD44nDSOqa13HgTvd7 — the same Tibetan text as bo-display, cut into 27
# segments. They are read as row sources `openpecha:<text_id>` (row k = segment k) paired
# with `openpecha:<text_id>#parent` (row k = the old-Tibetan span the upstream alignment
# annotation pairs with segment k), and that old Tibetan is carried onto the display
# Tibetan by letters (concordance.py), exactly as the commentaries' own cuts are (D2).

