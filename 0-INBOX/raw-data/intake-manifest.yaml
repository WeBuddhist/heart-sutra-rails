# Intake manifest — Heart Sūtra corpus (བཅོམ་ལྡན་འདས་མ་ཤེས་རབ་ཀྱི་ཕ་རོལ་ཏུ་ཕྱིན་པའི་སྙིང་པོ།)
#
# Read by 4-SYSTEM/Skills/aligned-corpus-intake/scripts/build_sources.py and verify.py.
# One entry per work, in build order (a work can only align to a work above it).
# Paths are relative to raw_root, written with plain spaces (the Drive export's
# no-break spaces are resolved by common.raw_path). Every value comes from the raw
# data: the per-work Dzongsar metadata sheets (cell text, never hyperlinks), the
# Resources catalogue (person ids only where its work id and author match the
# work's own sheet), OpenPecha text.json, and the docs. Empty = not recorded upstream.
# Human decisions are recorded where they apply (ref_corrections, notes), dated 2026-10-02.
# Inventory and characterisation: 0-INBOX/dzongsar-drive-inventory.md,
# 0-INBOX/openpecha-api-inventory.md, 0-INBOX/heart-sutra-intake-report.md.

raw_root: 0-INBOX/raw-data
openpecha_root: openpecha-api
sidecar_dir: 1-SOURCES/Annotations

works:

